<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Translated For You</title>
  <style>
    body { width: 280px; margin: 0; padding: 16px; font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; }
    h1 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    h1::before { content: 'A'; display: inline-grid; place-items: center; width: 24px; height: 24px; background: #1e3a5f; color: #fff; border: 1px solid #ffd700; border-radius: 4px; font-weight: 700; }
    label { display: block; margin: 12px 0 4px; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; }
    select { width: 100%; padding: 8px 10px; background: #2a2a2a; color: #e0e0e0; border: 1px solid #444; border-radius: 4px; font-size: 13px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 13px; }
    input[type=checkbox] { accent-color: #ffd700; width: 16px; height: 16px; cursor: pointer; }
    .hint { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.4; }
    code { background: #2a2a2a; padding: 2px 6px; border-radius: 3px; font-size: 12px; color: #ffd700; }
    button { margin-top: 14px; width: 100%; padding: 8px; background: #ffd700; color: #1a1a1a; border: 0; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
    button:hover { background: #ffea4d; }
    .ok { color: #4ade80; font-size: 12px; margin-top: 8px; text-align: center; }
    #loading { color: #aaa; font-size: 12px; margin-top: 8px; text-align: center; }
    #loading::after { content: ''; animation: dots 1.2s steps(4) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  </style>
</head>
<body>
  <h1>Translated For You</h1>

  <label for="srcLang">Source language</label>
  <select id="srcLang">
    <option value="auto">Auto-detect</option>
    <option value="id">Indonesian</option>
    <option value="en">English</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="zh-CN">Chinese (Simplified)</option>
  </select>

  <label for="tgtLang">Target language</label>
  <select id="tgtLang">
    <option value="en">English</option>
    <option value="id">Indonesian</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="zh-CN">Chinese (Simplified)</option>
  </select>

  <div class="row">
    <label for="autoFlip" style="margin:0; text-transform:none; letter-spacing:0; color:#e0e0e0; font-size:13px;">Auto-flip direction</label>
    <input type="checkbox" id="autoFlip" checked>
  </div>
  <div class="hint">If text is already in target language, translate the other way automatically.</div>

  <div class="hint" style="margin-top: 14px;">
    Tekan <code>Alt+Shift+T</code> di field teks manapun untuk menerjemahkan. Customize di <strong>chrome://extensions/shortcuts</strong>.
  </div>

  <button id="save">Save</button>
  <div class="ok" id="status" style="display:none;">Saved</div>
  <div id="loading"></div>

  <script src="popup.js" defer></script>
</body>
</html>
